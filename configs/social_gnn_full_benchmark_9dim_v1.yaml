version: social_gnn_experiment_v0
output_dir: evaluation_runs/gnn_9dim_full_v1/training
seed: 20261013
device: cuda:1

trials:
  - {id: A1_C1, node_npz: 'evaluation_runs\hybrid_9dim_v1\nodes\A1_C1_node_features.npz', edge_npz: 'D:\wxh本地化处理库\social_gnn_6dim_v0\video_features\A1_C1\edges\A1_C1_social_edges.npz'}
  - {id: A3_C3, node_npz: 'evaluation_runs\hybrid_9dim_v1\nodes\A3_C3_node_features.npz', edge_npz: 'D:\wxh本地化处理库\social_gnn_6dim_v0\video_features\A3_C3\edges\A3_C3_social_edges.npz'}
  - {id: A4_B4, node_npz: 'evaluation_runs\hybrid_9dim_v1\nodes\A4_B4_node_features.npz', edge_npz: 'D:\wxh本地化处理库\social_gnn_6dim_v0\video_features\A4_B4\edges\A4_B4_social_edges.npz'}
  - {id: A4_C4, node_npz: 'evaluation_runs\hybrid_9dim_v1\nodes\A4_C4_node_features.npz', edge_npz: 'D:\wxh本地化处理库\social_gnn_6dim_v0\video_features\A4_C4\edges\A4_C4_social_edges.npz'}
  - {id: A5_C5, node_npz: 'evaluation_runs\hybrid_9dim_v1\nodes\A5_C5_node_features.npz', edge_npz: 'D:\wxh本地化处理库\social_gnn_6dim_v0\video_features\A5_C5\edges\A5_C5_social_edges.npz'}

split:
  validation_trials: [A4_C4]
  excluded_trials: [A5_C5]

normalization: {epsilon: 1.0e-6}

model:
  hidden_dim: 64
  graph_dim: 64
  layers: 2
  decoder_hidden_dim: 64
  readout: mean
  fusion_hidden_dim: 192
  branch_hidden_dim: 32
  branch_fusion_hidden_dim: 64

ssl:
  node_mask_probability: 0.15
  edge_mask_probability: 0.15
  node_modality_dropout: 0.05
  edge_modality_dropout: 0.05
  couple_symmetric_traits: true
  node_loss_weight: 1.0
  edge_loss_weight: 1.0
  preserve_loss_weight: 2.0
  masked_loss_weight: 1.0

training:
  epochs: 100
  batch_size: 1
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0

# One controlled 9D rerun of every non-redundant architecture/objective tested
# during the 6D development phase. Per-run overrides remain in each checkpoint.
runs:
  - name: masked_strict_mean
    objective: masked_ssl
    edge_mode: full
    selection_metric: total
    ssl: {couple_symmetric_traits: false}

  - {name: masked_coupled_mean, objective: masked_ssl, edge_mode: full, selection_metric: total}
  - {name: masked_coupled_node_only, objective: masked_ssl, edge_mode: node_only, selection_metric: total}
  - {name: masked_coupled_shuffled, objective: masked_ssl, edge_mode: shuffled, selection_metric: total}

  - name: masked_coupled_g32
    objective: masked_ssl
    edge_mode: full
    selection_metric: total
    model: {graph_dim: 32}

  - name: masked_coupled_roleaware
    objective: masked_ssl
    edge_mode: full
    selection_metric: total
    model: {readout: role_aware}

  - name: masked_coupled_relational
    objective: masked_ssl
    edge_mode: full
    selection_metric: total
    relational_match_weight: 0.2
    model: {relational_match_head: true}

  - {name: graph_bottleneck_mean, objective: graph_ssl, edge_mode: full, selection_metric: total}

  - name: graph_bottleneck_soft_role
    objective: graph_ssl
    edge_mode: full
    selection_metric: total
    model: {readout: soft_role}

  - {name: mlp_graph_bottleneck, objective: mlp_graph_ssl, edge_mode: full, selection_metric: total}

  - {name: graph_full, objective: graph_full_ssl, edge_mode: full, selection_metric: total}
  - {name: graph_hybrid_p025, objective: graph_hybrid_ssl, edge_mode: full, preserve_loss_weight: 0.25, selection_metric: total}
  - {name: graph_hybrid_p05, objective: graph_hybrid_ssl, edge_mode: full, preserve_loss_weight: 0.5, selection_metric: total}
  - {name: graph_hybrid_p1, objective: graph_hybrid_ssl, edge_mode: full, preserve_loss_weight: 1.0, selection_metric: total}
  - {name: graph_hybrid_p2, objective: graph_hybrid_ssl, edge_mode: full, preserve_loss_weight: 2.0, selection_metric: total}

  - {name: node_branch_hybrid, objective: node_branch_hybrid_ssl, edge_mode: full, selection_metric: total}
  - {name: dual_branch_hybrid, objective: dual_branch_hybrid_ssl, edge_mode: full, selection_metric: total}

  - {name: graph_set_full, objective: graph_set_full_ssl, edge_mode: full, selection_metric: total}
  - {name: graph_set_hybrid, objective: graph_set_hybrid_ssl, edge_mode: full, selection_metric: total}
  - {name: dual_set_hybrid, objective: dual_set_hybrid_ssl, edge_mode: full, selection_metric: total}
  - {name: dual_joint_hybrid, objective: dual_joint_hybrid_ssl, edge_mode: full, selection_metric: total}
