version: social_v0
model: gine
node_dim: null # inferred from SocialTrialPackage.node_features.shape[-1] (currently 9)
edge_dim: 16   # 8 values + 8 coverage-aware per-trait confidences
hidden_dim: 64
layers: 2
graph: complete_directed
self_loops: false
single_animal: bypass
embedding:
  name: g_t
  temporal_encoder: none
  export_for_downstream: true
downstream:
  examples: [clustering, hmm, hsmm]
  train_with_gnn: false
ssl:
  type: masked_multimodal_reconstruction
  node_mask_probability: 0.15
  edge_mask_probability: 0.15
  node_modality_dropout: 0.05
  edge_modality_dropout: 0.05
  node_loss_weight: 1.0
  edge_loss_weight: 1.0
parallel_vae:
  enabled: false
  latent_dim: 32
  kl_beta: 0.001
