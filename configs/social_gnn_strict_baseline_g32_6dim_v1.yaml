split:
  validation_trials: [A4_C4]
  test_trials: [A5_C5]

normalization:
  epsilon: 1.0e-6

model:
  # Keep the GNN/message-passing capacity at 64 and reduce only exported g_t.
  hidden_dim: 64
  graph_dim: 32
  layers: 2
  decoder_hidden_dim: 64
  readout: mean

ssl:
  node_mask_probability: 0.15
  edge_mask_probability: 0.15
  node_modality_dropout: 0.05
  edge_modality_dropout: 0.05
  couple_symmetric_traits: false
  node_loss_weight: 1.0
  edge_loss_weight: 1.0

training:
  epochs: 100
  batch_size: 1
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0

runs:
  - name: strict_original_mask_g32
    objective: masked_ssl
    edge_mode: full
    selection_metric: total
