version: social_gnn_experiment_v0
architecture_version: pointwise_0p04_v2
output_dir: evaluation_runs/gnn_9dim_0p04_v2/training
seed: 20261013
device: cuda:1

clock:
  patch_duration_s: 0.04
  patch_stride_s: 0.04

trials:
  - {id: A1_C1, node_npz: 'evaluation_runs\gnn_9dim_0p04_v2\nodes\A1_C1_node_features.npz', edge_npz: 'evaluation_runs\gnn_9dim_0p04_v2\edges\A1_C1_social_edges.npz'}
  - {id: A3_C3, node_npz: 'evaluation_runs\gnn_9dim_0p04_v2\nodes\A3_C3_node_features.npz', edge_npz: 'evaluation_runs\gnn_9dim_0p04_v2\edges\A3_C3_social_edges.npz'}
  - {id: A4_B4, node_npz: 'evaluation_runs\gnn_9dim_0p04_v2\nodes\A4_B4_node_features.npz', edge_npz: 'evaluation_runs\gnn_9dim_0p04_v2\edges\A4_B4_social_edges.npz'}
  - {id: A4_C4, node_npz: 'evaluation_runs\gnn_9dim_0p04_v2\nodes\A4_C4_node_features.npz', edge_npz: 'evaluation_runs\gnn_9dim_0p04_v2\edges\A4_C4_social_edges.npz'}
  - {id: A5_C5, node_npz: 'evaluation_runs\gnn_9dim_0p04_v2\nodes\A5_C5_node_features.npz', edge_npz: 'evaluation_runs\gnn_9dim_0p04_v2\edges\A5_C5_social_edges.npz'}

split:
  validation_trials: [A4_C4]
  excluded_trials: [A5_C5]

normalization: {epsilon: 1.0e-6}

model:
  hidden_dim: 64
  graph_dim: 64
  layers: 2
  decoder_hidden_dim: 64
  readout: mean

ssl:
  node_mask_probability: 0.15
  edge_mask_probability: 0.15
  node_modality_dropout: 0.05
  edge_modality_dropout: 0.05
  couple_symmetric_traits: true
  node_loss_weight: 1.0
  edge_loss_weight: 1.0
  preserve_loss_weight: 2.0
  masked_loss_weight: 1.0

training:
  epochs: 100
  batch_size: 1
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0

runs:
  - {name: graph_full, objective: graph_full_ssl, edge_mode: full, selection_metric: total}
  - {name: graph_hybrid_p2, objective: graph_hybrid_ssl, edge_mode: full, preserve_loss_weight: 2.0, selection_metric: total}
